# CI：每次 push 与 PR 都跑一遍本地验证过的同一套门禁。
#
# 设计原则：**CI 里跑的必须和本地跑的一模一样**。
# 如果 CI 用的是另一套命令，就会出现"本地绿、CI 红"或者反过来，
# 那 CI 就从质量保障变成了噪音来源。
#
# 本地对应的三条命令：
#   cd backend  && pytest -q && ruff check app scripts
#   cd frontend && npm run typecheck && npm run build

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 同一分支连续 push 时取消上一次未跑完的任务，省额度也更快出结果
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 · pytest + ruff (py${{ matrix.python-version }})
    # 固定到具体镜像而不是 ubuntu-latest：
    # GitHub 计划 2026-10-19 把 ubuntu-latest 迁到 Ubuntu 26，
    # 固定版本能避免那次迁移把构建悄悄搞坏。
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        # 这个矩阵不是凑数 —— 它是为了验证 requirements.txt 里
        # "用 >= 而不是 == 锁定" 这个说法：3.11 到 3.13 都应该能装上。
        # 只写不验的话，那句注释就只是安慰自己。
        python-version: ["3.11", "3.12", "3.13"]

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 代码检查
        run: ruff check app scripts

      - name: 单元与集成测试
        # 测试用内存 SQLite（StaticPool），不需要任何数据库服务
        run: pytest -q

  frontend:
    name: 前端 · typecheck + build
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 本地是在 Node 24 上验证的，CI 保持一致，避免环境差异掩盖问题
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 用 ci 而不是 install：严格按 lockfile 安装，能发现 lockfile 与 package.json 不一致
      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 生产构建
        run: npm run build
