# CI：每次 push 与 PR 都跑一遍本地验证过的同一套门禁。
#
# 设计原则：**CI 里跑的必须和本地跑的一模一样**。
# 如果 CI 用的是另一套命令，就会出现"本地绿、CI 红"或者反过来，
# 那 CI 就从质量保障变成了噪音来源。
#
# 本地对应的三条命令：
#   cd backend  && pytest -q && ruff check app scripts
#   cd frontend && npm run typecheck && npm run build

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 同一分支连续 push 时取消上一次未跑完的任务，省额度也更快出结果
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 · pytest + ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 本地是在 Python 3.14 上验证的，CI 用 3.12 覆盖更主流的部署环境。
          # requirements 用的是 >= 下限而不是 == 锁定，两个版本都能装上。
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 代码检查
        run: ruff check app scripts

      - name: 单元与集成测试
        # 测试用内存 SQLite（StaticPool），不需要任何数据库服务
        run: pytest -q

  frontend:
    name: 前端 · typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 用 ci 而不是 install：严格按 lockfile 安装，能发现 lockfile 与 package.json 不一致
      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 生产构建
        run: npm run build
